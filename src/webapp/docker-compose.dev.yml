version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-manager-api:dev
    container_name: task-manager-dev
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - FLASK_APP=app.py
    volumes:
      - ./:/app
      - /app/venv
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge