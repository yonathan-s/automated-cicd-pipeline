name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'src/webapp/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: dev-task-manager-api
  ECS_CLUSTER: dev-task-manager-cluster
  ECS_SERVICE: dev-task-manager-service
  CONTAINER_NAME: task-manager-container

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # Only expose a safe boolean output (NOT the ARN)
    outputs:
      deployed: ${{ steps.mark-deployed.outputs.deployed }}

    steps:
      - name: Record start time
        id: start-time
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          echo "Deployment started at: $(date)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Capture the task definition BEFORE any deploy attempt
      - name: Capture current ECS task definition (pre-deploy)
        id: capture-prev-taskdef
        run: |
          set -euo pipefail

          PREV_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text \
            --region "$AWS_REGION")

          if [ -z "$PREV_TASK_DEF_ARN" ] || [ "$PREV_TASK_DEF_ARN" = "None" ]; then
            echo "ERROR: Could not determine previous task definition ARN."
            exit 1
          fi

          echo "$PREV_TASK_DEF_ARN" > prev-taskdef.txt
          echo "Captured previous task definition ARN."

      # Store task def as artifact (avoids GitHub output secret-blocking)
      - name: Upload previous task definition artifact
        uses: actions/upload-artifact@v4
        with:
          name: prev-taskdef
          path: prev-taskdef.txt

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ./src/webapp
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Save scan results
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif

      # Tests MUST be allowed to fail the job (no || true)
      - name: Run tests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" python -m pytest tests/ -v

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to ECS
        id: deploy
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      # Mark that a deploy was actually attempted (safe output)
      - name: Mark deployed
        id: mark-deployed
        run: echo "deployed=true" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Get ALB DNS name
        id: get-alb
        run: |
          set -euo pipefail
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names dev-task-manager-alb \
            --region "$AWS_REGION" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Validate health endpoint
        run: |
          set -euo pipefail
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ steps.get-alb.outputs.alb_dns }}/health" || echo "000")
            if [ "$response" = "200" ]; then exit 0; fi
            sleep 30
            attempt=$((attempt + 1))
          done

          exit 1

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: build-and-deploy

    # Only rollback if:
    # - build job failed AND
    # - a deploy was actually attempted
    if: ${{ always() && needs.build-and-deploy.result == 'failure' && needs.build-and-deploy.outputs.deployed == 'true' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download previous task definition artifact
        uses: actions/download-artifact@v4
        with:
          name: prev-taskdef

      - name: Rollback deployment to previous task definition
        run: |
          set -euo pipefail
          PREV_TASK_DEF_ARN=$(cat prev-taskdef.txt)

          if [ -z "$PREV_TASK_DEF_ARN" ]; then
            echo "ERROR: prev-taskdef.txt is empty."
            exit 1
          fi

          echo "Rolling back to: $PREV_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREV_TASK_DEF_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for rollback to stabilize
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"