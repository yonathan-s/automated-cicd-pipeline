name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'src/webapp/**'


permissions:
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: dev-task-manager-api
  ECS_CLUSTER: dev-task-manager-cluster
  ECS_SERVICE: dev-task-manager-service
  CONTAINER_NAME: task-manager-container

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # Safe output only 
    outputs:
      deployed: ${{ steps.mark-deployed.outputs.deployed }}

    steps:
      - name: Record start time
        id: start-time
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          echo "Deployment started at: $(date)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Capture task definition BEFORE any deploy, store as artifact (avoids "output may contain secret" skipping)
      - name: Capture current ECS task definition (pre-deploy)
        run: |
          set -euo pipefail

          echo "Cluster: $ECS_CLUSTER"
          echo "Service: $ECS_SERVICE"
          echo "Region:  $AWS_REGION"

          PREV_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text \
            --region "$AWS_REGION")

          if [ -z "$PREV_TASK_DEF_ARN" ] || [ "$PREV_TASK_DEF_ARN" = "None" ]; then
            echo "ERROR: Could not determine previous task definition ARN (got: '$PREV_TASK_DEF_ARN')."
            echo "Check ECS_CLUSTER/ECS_SERVICE/AWS_REGION and IAM permission ecs:DescribeServices."
            exit 1
          fi

          echo "$PREV_TASK_DEF_ARN" > prev-taskdef.txt
          echo "Captured previous task definition ARN."

      - name: Upload previous task definition artifact
        uses: actions/upload-artifact@v4
        with:
          name: prev-taskdef
          path: prev-taskdef.txt

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ./src/webapp
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Building Docker image..."
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Docker image built successfully"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Save scan results
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif

      # Tests MUST fail the job if they fail
      - name: Run tests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Running tests in Docker container..."
          docker run --rm "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" python -m pytest tests/ -v
          echo "Tests completed"

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Pushing image to ECR..."
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Image pushed successfully"

      - name: Deploy to ECS
        id: deploy
        run: |
          set -euo pipefail
          echo "Updating ECS service..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          echo "ECS service update initiated"

      # Mark that a deploy was actually attempted (safe output used by rollback condition)
      - name: Mark deployed
        id: mark-deployed
        run: echo "deployed=true" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          set -euo pipefail
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "Deployment complete!"

      - name: Get ALB DNS name
        id: get-alb
        run: |
          set -euo pipefail
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names dev-task-manager-alb \
            --region "$AWS_REGION" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "ALB DNS: $ALB_DNS"

      - name: Validate health endpoint
        run: |
          set -euo pipefail
          echo "Validating deployment..."
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            echo "Attempt $((attempt + 1))/$max_attempts"

            response=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ steps.get-alb.outputs.alb_dns }}/health" || echo "000")

            if [ "$response" = "200" ]; then
              echo "✓ Health check passed!"
              exit 0
            fi

            echo "Health check returned: $response"
            echo "Waiting 30 seconds before retry..."
            sleep 30
            attempt=$((attempt + 1))
          done

          echo "✗ Health check failed after $max_attempts attempts"
          exit 1

      # BACK: Deployment Summary
      - name: Deployment Summary
        if: always()
        run: |
          echo "================================"
          echo "DEPLOYMENT SUMMARY"
          echo "================================"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Status: ${{ job.status }}"
          echo "Application URL: http://${{ steps.get-alb.outputs.alb_dns }}"
          echo "================================"

      # BACK: Deployment Metrics
      - name: Record deployment metrics
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.start-time.outputs.start_time }}
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))

          echo "================================"
          echo "DEPLOYMENT METRICS"
          echo "================================"
          echo "Total Duration: ${MINUTES}m ${SECONDS}s"
          echo "Build Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Timestamp: $(date)"
          echo "================================"

      - name: Deployment Failed Notification
        if: failure()
        run: |
          echo "=========================================="
          echo "DEPLOYMENT FAILED"
          echo "=========================================="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Time: $(date)"
          echo ""
          echo "Check the logs above for details."
          echo "Rollback job will attempt to restore service."
          echo "=========================================="

      - name: Deployment Success Notification
        if: success()
        run: |
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Application: http://${{ steps.get-alb.outputs.alb_dns }}"
          echo "Time: $(date)"
          echo "=========================================="
      
      - name: Send metrics to platform
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.start-time.outputs.start_time }}
          DURATION=$((END_TIME - START_TIME))
          
          # Send metrics to your platform
          curl -X POST http://YOUR_PLATFORM_URL/api/deployments \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_type": "automated",
              "commit_sha": "${{ github.sha }}",
              "duration_seconds": '"$DURATION"',
              "status": "${{ job.status }}",
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",
              "triggered_by": "${{ github.actor }}",
              "tests_passed": true,
              "security_scan_passed": true,
              "errors_count": 0
            }'

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: build-and-deploy

    #  Only rollback when:
    # - build-and-deploy failed AND
    # - deploy was actually attempted (so we don't rollback when tests fail before deploy)
    if: ${{ always() && needs.build-and-deploy.result == 'failure' && needs.build-and-deploy.outputs.deployed == 'true' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download previous task definition artifact
        uses: actions/download-artifact@v4
        with:
          name: prev-taskdef

      - name: Rollback deployment to previous task definition
        run: |
          set -euo pipefail
          echo "Deployment failed! Rolling back..."

          PREV_TASK_DEF_ARN=$(cat prev-taskdef.txt)
          if [ -z "$PREV_TASK_DEF_ARN" ]; then
            echo "ERROR: prev-taskdef.txt is empty."
            exit 1
          fi

          echo "Rolling back to: $PREV_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREV_TASK_DEF_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Rollback initiated"

      - name: Wait for rollback to stabilize
        run: |
          set -euo pipefail
          echo "Waiting for rollback to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "Rollback complete!"

      - name: Rollback Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT FAILED AND ROLLED BACK"
          echo "=========================================="
          echo "Restored task definition: $(cat prev-taskdef.txt)"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "=========================================="
      